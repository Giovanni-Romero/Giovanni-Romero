<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
<title id="t">Giovanni Romero — Python Software Engineer</title>
<desc id="d">Dark navy banner with a minimalist developer terminal, turquoise and violet accents, and Python, AI, and backend engineering emphasis.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#0A1023"/>
    <stop offset="58%" stop-color="#0C1831"/>
    <stop offset="100%" stop-color="#172346"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38D8C0"/>
    <stop offset="100%" stop-color="#8B85FF"/>
  </linearGradient>
  <radialGradient id="halo" cx="73%" cy="45%" r="63%">
    <stop offset="0%" stop-color="#374C95" stop-opacity=".34"/>
    <stop offset="100%" stop-color="#374C95" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0 H0 V36" fill="none" stroke="#8CA3CD" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
  <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14" />
  </filter>
</defs>
<rect width="1280" height="340" rx="22" fill="url(#bg)"/>
<rect width="1280" height="340" rx="22" fill="url(#grid)"/>
<rect width="1280" height="340" rx="22" fill="url(#halo)"/>
<rect x="0" y="0" width="8" height="340" fill="url(#glow)"/>
<circle cx="1025" cy="76" r="74" fill="#727CF2" opacity=".18" filter="url(#drop)"/>
<!-- Small brand mark -->
<rect x="54" y="42" width="46" height="46" rx="12" fill="#162A41" stroke="#40D3C5" stroke-opacity=".7"/>
<text x="77" y="72" text-anchor="middle" font-family="monospace" font-weight="700" font-size="18" fill="#50E2CA">&lt;/&gt;</text>
<text x="114" y="71" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#AABAD8">DEVELOPER PROFILE</text>
<!-- Main title -->
<text x="54" y="160" font-family="Arial, sans-serif" font-size="52" letter-spacing="-1.2" font-weight="700" fill="#F7FAFF">GIOVANNI</text>
<text x="54" y="221" font-family="Arial, sans-serif" font-size="52" letter-spacing="-1.2" font-weight="700" fill="#F7FAFF">ROMERO<tspan fill="#4ADBC9">.</tspan></text>
<text x="56" y="259" font-family="Arial, sans-serif" font-size="17" fill="#AFC1DA">Python Software Engineer  /  AI Applications</text>
<g font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".6">
  <rect x="54" y="282" width="98" height="31" rx="8" fill="#163E49" stroke="#50D8CC" stroke-opacity=".36"/>
  <text x="103" y="302" text-anchor="middle" fill="#7EF1DD">PYTHON</text>
  <rect x="161" y="282" width="112" height="31" rx="8" fill="#282C58" stroke="#9A91FF" stroke-opacity=".4"/>
  <text x="217" y="302" text-anchor="middle" fill="#BCB4FF">APPLIED AI</text>
  <rect x="282" y="282" width="109" height="31" rx="8" fill="#172C46" stroke="#7298D7" stroke-opacity=".4"/>
  <text x="336" y="302" text-anchor="middle" fill="#BDD6FF">BACKEND</text>
</g>
<!-- terminal -->
<rect x="694" y="56" width="525" height="240" rx="17" fill="#071225" stroke="#6E83B3" stroke-opacity=".38" stroke-width="2"/>
<rect x="695" y="57" width="523" height="45" rx="16" fill="#17243C"/>
<rect x="695" y="86" width="523" height="18" fill="#17243C"/>
<circle cx="722" cy="78" r="5.5" fill="#F58A8B"/>
<circle cx="741" cy="78" r="5.5" fill="#F5C47D"/>
<circle cx="760" cy="78" r="5.5" fill="#62D9B3"/>
<text x="959" y="83" font-family="monospace" font-size="14" text-anchor="middle" fill="#AABAD8">giovanni@dev ~ / build</text>
<g font-family="monospace" font-size="18">
  <text x="725" y="139" fill="#61E0C5">$ <tspan fill="#ECF3FF">whoami</tspan></text>
  <text x="725" y="173" fill="#AFC2DF">engineer<tspan fill="#7C8BF5">.</tspan><tspan fill="#ECF3FF">build(</tspan><tspan fill="#73E6CE">"useful software"</tspan><tspan fill="#ECF3FF">)</tspan></text>
  <text x="725" y="207" fill="#AFC2DF">focus = [<tspan fill="#73E6CE">"AI"</tspan>, <tspan fill="#73E6CE">"APIs"</tspan>, <tspan fill="#73E6CE">"Automation"</tspan>]</text>
  <text x="725" y="242" fill="#AFC2DF">location = <tspan fill="#73E6CE">"Germany"</tspan></text>
  <text x="725" y="278" fill="#60E6BB">✓ ready to build <tspan fill="#ECF3FF">_</tspan></text>
</g>
</svg>